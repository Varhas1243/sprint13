{% extends "base.html" %}

{% block title %}Редагування користувача{% endblock %}

{% block content %}
<h2>Редагування користувача</h2>

<form method="post" novalidate>
    {% csrf_token %}

    {{ form.non_field_errors }}
    {{ form.as_p }}

    <p><button type="submit">Зберегти зміни</button></p>
</form>

<p><a href="{% url 'user_detail' library_user.id %}">Назад до користувача</a></p>
{% endblock %}
