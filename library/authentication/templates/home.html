{% extends "base.html" %}

{% block title %}Головна{% endblock %}

{% block content %}
<h2>Ласкаво просимо до бібліотеки</h2>

{% if request.user.is_authenticated %}
    <p>Ви увійшли як: {{ request.user.email }}</p>
{% else %}
    <p>Щоб користуватися бібліотекою, увійдіть або зареєструйтесь.</p>
{% endif %}
{% endblock %}
