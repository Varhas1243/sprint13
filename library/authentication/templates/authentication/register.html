
{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<h2>Реєстрація</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>Ім'я:</p>
    <input type="text" name="first_name" required>

    <p>Прізвище:</p>
    <input type="text" name="last_name" required>

    <p>По батькові:</p>
    <input type="text" name="middle_name" required>

    <p>Email:</p>
    <input type="email" name="email" required>

    <p>Пароль:</p>
    <input type="password" name="password" required>

    <p>Роль:</p>
    <select name="role">
        <option value="0">Читач</option>
        <option value="1">Бібліотекар</option>
    </select>

    <p><button type="submit">Зареєструватися</button></p>
</form>

<a href="{% url 'login' %}">Увійти</a>
{% endblock %}
