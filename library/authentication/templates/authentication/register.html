
{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<h2>Реєстрація</h2>

<form method="post" novalidate>
    {% csrf_token %}

    {{ form.non_field_errors }}
    {{ form.as_p }}

    <p><button type="submit">Зареєструватися</button></p>
</form>

<a href="{% url 'login' %}">Увійти</a>
{% endblock %}
