
{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<h2>Вхід</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>Email:</p>
    <input type="email" name="email" required>

    <p>Пароль:</p>
    <input type="password" name="password" required>

    <p><button type="submit">Увійти</button></p>
</form>

<a href="{% url 'register' %}">Зареєструватися</a>
{% endblock %}
