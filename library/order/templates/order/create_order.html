{% extends "base.html" %}

{% block title %}Замовлення книги{% endblock %}

{% block content %}
<h2>Замовлення книги</h2>

{% if form.fields.book.queryset.exists %}
    <form method="post" novalidate>
        {% csrf_token %}

        {{ form.non_field_errors }}
        {{ form.as_p }}

        <p><button type="submit">Замовити</button></p>
    </form>
{% else %}
    <p>Книг немає</p>
{% endif %}

<p><a href="{% url 'book_list' %}">Назад до книг</a></p>
{% endblock %}
