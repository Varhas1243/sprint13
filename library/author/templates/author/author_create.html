{% extends "base.html" %}

{% block title %}Додавання автора{% endblock %}

{% block content %}
<h2>Додавання автора</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>Ім'я:</p>
    <input type="text" name="name" maxlength="20" required>

    <p>Прізвище:</p>
    <input type="text" name="surname" maxlength="20" required>

    <p>По батькові:</p>
    <input type="text" name="patronymic" maxlength="20" required>

    <p><button type="submit">Додати автора</button></p>
</form>

<p><a href="{% url 'author_list' %}">Назад до авторів</a></p>
{% endblock %}
